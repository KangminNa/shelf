services:
  shelf:
    build: .
    container_name: shelf
    restart: unless-stopped
    ports:
      - "80:80"                # reverse proxy (HTTP + ACME challenge)
      - "443:443"              # reverse proxy (HTTPS)
      - "127.0.0.1:81:81"      # admin UI — 프록시 경유로만 접근 (외부 노출 없음)
      - "127.0.0.1:9100:9100"  # CI/CD webhooks — hooks 도메인으로 프록시 경유
    volumes:
      # 호스트 Docker 데몬으로 앱 컨테이너를 빌드/실행
      - /var/run/docker.sock:/var/run/docker.sock
      # 런타임 데이터: DB, SSL 인증서, 클론된 저장소
      - ./data:/app/data
      # 자기 재배포용: Shelf 소스 저장소 (SELF_DEPLOY_DIR와 일치)
      - ./:/shelf
    environment:
      - PORT=81
      - NODE_ENV=production
      - PROXY_HTTP_PORT=80
      - PROXY_HTTPS_PORT=443
      - WEBHOOK_PORT=9100
      # 앱 컨테이너와 공유하는 네트워크 — 프록시가 컨테이너 이름으로 앱에 직접 도달
      - SHELF_NETWORK=shelf-net
      # - ACME_EMAIL=you@example.com
      # 관리 UI를 프록시(80/443) 뒤로 자동 등록
      # - ADMIN_DOMAIN=shelf.example.com
      # Shelf 자기 재배포(CI/CD) — 설정하면 POST /hooks/self 활성화
      # GitHub webhook: https://<도메인>/hooks/self (프록시 경유) + 아래 secret
      # - SELF_DEPLOY_SECRET=change-me-to-a-long-random-string
      # - SELF_DEPLOY_DIR=/shelf
      # - SELF_DEPLOY_BRANCH=main
    networks:
      - shelf-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:81/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  shelf-net:
    name: shelf-net
