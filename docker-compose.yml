services:
  shelf:
    build: .
    container_name: shelf
    restart: unless-stopped
    ports:
      - "80:80"                # reverse proxy (HTTP + ACME challenge)
      - "443:443"              # reverse proxy (HTTPS)
      - "127.0.0.1:81:81"      # admin UI — 프록시 경유로만 접근 (외부 노출 없음)
      - "127.0.0.1:9100:9100"  # CI/CD webhooks — hooks 도메인으로 프록시 경유
    volumes:
      # 호스트 Docker 데몬으로 앱 컨테이너를 빌드/실행
      - /var/run/docker.sock:/var/run/docker.sock
      # 런타임 데이터: DB, SSL 인증서, 클론된 저장소
      - ./data:/app/data
      # 자기 재배포용: Shelf 소스 저장소 (SELF_DEPLOY_DIR와 일치)
      - ./:/shelf
    # 운영 설정은 .env 파일에 둔다 (git 추적 안 됨 → git pull 충돌 없음)
    #   ADMIN_DOMAIN=shelf.example.com
    #   ACME_EMAIL=you@example.com
    #   SELF_DEPLOY_SECRET=<openssl rand -hex 32>
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=81
      - NODE_ENV=production
      - PROXY_HTTP_PORT=80
      - PROXY_HTTPS_PORT=443
      - WEBHOOK_PORT=9100
      # 앱 컨테이너와 공유하는 네트워크 — 프록시가 컨테이너 이름으로 앱에 직접 도달
      - SHELF_NETWORK=shelf-net
      - SELF_DEPLOY_DIR=/shelf
    networks:
      - shelf-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:81/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Shelf와 앱 컨테이너가 공유하는 네트워크. compose가 만들고 Shelf가 앱을 붙인다.
# 이미 존재하면 그대로 사용된다 (docker network create shelf-net 을 미리 해둬도 무방).
networks:
  shelf-net:
    name: shelf-net
